# Configuración del panel (Sveltia CMS) — https://sveltiacms.app/en/docs
backend:
  name: github
  repo: Liku-beep-boop/centro-yoga
  branch: main
  base_url: https://sveltia-cms-auth.daniel-trake02.workers.dev
  commit_messages:
    create: "Nuevo: {{collection}} «{{slug}}»"
    update: "Actualizado: {{collection}} «{{slug}}»"
    delete: "Borrado: {{collection}} «{{slug}}»"
    uploadMedia: "Imagen subida: {{path}}"
    deleteMedia: "Imagen borrada: {{path}}"

site_url: https://centroargentinoyogareiki.com.ar
display_url: https://centroargentinoyogareiki.com.ar
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

# ─────────── Accesos directos en la barra lateral (un solo archivo cada uno) ───────────
singletons:
  - name: horarios
    label: Horarios de clases
    icon: schedule
    file: src/data/horarios.json
    fields:
      - label: Aviso arriba de la grilla
        name: aviso
        widget: text
        required: false
        hint: Aparece debajo del título "Horarios" en la web.
      # Una lista por día. Las clases ya cargadas aparecen plegadas en una línea ("08:00 · Hatha Yoga").
      - label: Lunes
        name: lunes
        widget: list
        label_singular: clase
        required: false
        collapsed: auto
        summary: "{{fields.inicio}} · {{fields.clase}}"
        hint: "Tocá **Agregar clase** para sumar una. Para repetir una clase en otro día: menú **⋮** de la clase → **Copiar**, y en el otro día **Pegar**. El orden no importa: la web ordena por hora."
        fields: &campos_clase
          - { label: Empieza, name: inicio, widget: datetime, type: time, format: HH:mm }
          - { label: Termina, name: fin, widget: datetime, type: time, format: HH:mm, required: false }
          - { label: Clase, name: clase, widget: string, hint: "Ej. Hatha Yoga, Vinyasa, Meditación" }
          - { label: Profesora, name: profesora, widget: string, required: false }
          - label: Nivel
            name: nivel
            widget: select
            options: [Todos los niveles, Principiantes, Intermedio, Avanzado]
            default: Todos los niveles
            required: false
      - { label: Martes, name: martes, widget: list, label_singular: clase, required: false, collapsed: auto, summary: "{{fields.inicio}} · {{fields.clase}}", fields: *campos_clase }
      - { label: Miércoles, name: miercoles, widget: list, label_singular: clase, required: false, collapsed: auto, summary: "{{fields.inicio}} · {{fields.clase}}", fields: *campos_clase }
      - { label: Jueves, name: jueves, widget: list, label_singular: clase, required: false, collapsed: auto, summary: "{{fields.inicio}} · {{fields.clase}}", fields: *campos_clase }
      - { label: Viernes, name: viernes, widget: list, label_singular: clase, required: false, collapsed: auto, summary: "{{fields.inicio}} · {{fields.clase}}", fields: *campos_clase }
      - { label: Sábado, name: sabado, widget: list, label_singular: clase, required: false, collapsed: auto, summary: "{{fields.inicio}} · {{fields.clase}}", fields: *campos_clase }
      - { label: Domingo, name: domingo, widget: list, label_singular: clase, required: false, collapsed: auto, summary: "{{fields.inicio}} · {{fields.clase}}", fields: *campos_clase }

  - name: precios
    label: Precios
    icon: payments
    file: src/data/precios.json
    fields:
      - { label: Texto introductorio, name: intro, widget: text, required: false }
      - label: Planes
        name: planes
        widget: list
        label_singular: plan
        collapsed: auto
        summary: "{{fields.nombre}} — {{fields.precio}}{{fields.destacado | ternary(' ★ Recomendado', '')}}"
        fields:
          - { label: Nombre del plan, name: nombre, widget: string, hint: "Ej. 2 veces por semana" }
          - { label: Precio, name: precio, widget: string, hint: "Tal cual se muestra. Ej. $ 25.000" }
          - { label: Período, name: periodo, widget: string, required: false, hint: "Ej. por mes, por clase" }
          - label: Qué incluye
            name: detalle
            widget: list
            required: false
            label_singular: ítem
            field: { label: Ítem, name: item, widget: string }
          - { label: Marcar como "Recomendado", name: destacado, widget: boolean, default: false, required: false }
      - { label: Nota al pie, name: nota, widget: text, required: false }

  - name: libro
    label: El libro
    icon: menu_book
    file: src/data/libro.json
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Subtítulo, name: subtitulo, widget: string, required: false }
      - { label: Portada, name: portada, widget: image, required: false }
      - { label: Descripción, name: descripcion, widget: text, hint: "Dejá una línea en blanco entre párrafos." }
      - { label: Frase destacada, name: cita, widget: text, required: false }
      - label: Botones de compra
        name: links
        widget: list
        label_singular: botón
        collapsed: auto
        summary: "{{fields.texto}}"
        fields:
          - { label: Texto del botón, name: texto, widget: string, hint: "Ej. Comprar en Mercado Libre" }
          - { label: Link, name: url, widget: string, type: url }

  - divider: true

  - name: sitio
    label: Datos del sitio y contacto
    icon: settings
    file: src/data/sitio.json
    fields:
      - { label: Nombre del centro, name: nombre, widget: string }
      - { label: Frase principal (portada), name: eslogan, widget: string }
      - { label: Descripción corta, name: descripcion, widget: text, hint: "Aparece en la portada y en Google." }
      - { label: Nombre de la profesora, name: profesora, widget: string, required: false }
      - { label: Foto de fondo de la portada, name: hero_imagen, widget: image, required: false }
      - label: WhatsApp
        name: whatsapp
        widget: string
        required: false
        hint: "Con código de país, sin + ni espacios. Ej. celular 11 5567-5161 → **5491155675161**"
      - { label: Mensaje inicial de WhatsApp, name: whatsapp_mensaje, widget: string, required: false }
      - { label: Email, name: email, widget: string, required: false, hint: "Si queda vacío, no se muestra en la web." }
      - { label: Instagram, name: instagram, widget: string, required: false, hint: "Link completo, empezando con https://" }
      - { label: Facebook, name: facebook, widget: string, required: false, hint: "Link completo, empezando con https://" }
      - { label: YouTube, name: youtube, widget: string, required: false, hint: "Link completo, empezando con https://" }
      - { label: Dirección, name: direccion, widget: string, required: false }
      - label: Mapa
        name: mapa_embed
        widget: string
        required: false
        hint: "Link del mapa de Google para mostrar en Contacto. Vacío = sin mapa."
      - label: Clave de Web3Forms
        name: web3forms_key
        widget: string
        required: false
        hint: "Para el formulario de contacto. Vacío = sin formulario."

collections:
  # ───────────────────────── BLOG ─────────────────────────
  - name: blog
    label: Entradas del blog
    label_singular: Entrada
    description: Novedades y reflexiones que aparecen en la sección Blog.
    icon: edit_note
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{fecha | date('DD/MM/YYYY')}} — {{titulo}}"
    sortable_fields: [fecha, titulo]
    fields:
      - { label: Título, name: titulo, widget: string }
      - label: Fecha
        name: fecha
        widget: datetime
        time_format: false
        date_format: DD/MM/YYYY
        format: YYYY-MM-DD
        default: "{{now}}"
      - { label: Resumen, name: resumen, widget: text, required: false, hint: "Aparece en la tarjeta del blog." }
      - { label: Imagen de portada, name: portada, widget: image, required: false }
      - { label: Borrador (no se publica todavía), name: borrador, widget: boolean, default: false, required: false }
      - { label: Texto, name: body, widget: markdown }

  # ──────────────────── TALLERES / EVENTOS ────────────────────
  - name: eventos
    label: Talleres y eventos
    label_singular: Evento
    description: Talleres, retiros y encuentros con fecha. Los que ya pasaron se ocultan solos de la web.
    icon: event
    folder: src/content/eventos
    create: true
    extension: md
    format: frontmatter
    identifier_field: titulo
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{fecha | date('DD/MM/YYYY')}} — {{titulo}}"
    sortable_fields: [fecha, titulo]
    fields:
      - { label: Nombre del evento, name: titulo, widget: string }
      - label: Fecha
        name: fecha
        widget: datetime
        time_format: false
        date_format: DD/MM/YYYY
        format: YYYY-MM-DD
      - { label: Empieza, name: hora, widget: datetime, type: time, format: HH:mm, required: false }
      - { label: Termina, name: hora_fin, widget: datetime, type: time, format: HH:mm, required: false }
      - { label: Lugar, name: lugar, widget: string, required: false, default: En el centro }
      - { label: Precio, name: precio, widget: string, required: false, hint: "Ej. $ 20.000 o Gratuito" }
      - { label: Imagen, name: imagen, widget: image, required: false }
      - label: Link de inscripción
        name: inscripcion
        widget: string
        required: false
        hint: "Si queda vacío, el botón Inscribirme abre WhatsApp con un mensaje listo."
      - { label: Descripción, name: body, widget: text, required: false }

  # ───────────────────── PÁGINAS DE TEXTO ─────────────────────
  - name: paginas
    label: Páginas
    description: Textos de las páginas "Quién soy" y "Formación".
    icon: article
    files:
      - name: sobre
        label: Quién soy
        file: src/content/paginas/sobre.md
        fields: &campos_pagina
          - { label: Título, name: titulo, widget: string }
          - { label: Subtítulo, name: subtitulo, widget: text, required: false }
          - { label: Foto, name: imagen, widget: image, required: false }
          - { label: Texto, name: body, widget: markdown }
      - name: formacion
        label: Formación de profesoras
        file: src/content/paginas/formacion.md
        fields: *campos_pagina
